<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bloc-notes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <div class="d-flex vh-100 overflow-hidden">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar bg-dark border-end d-flex flex-column">
      <div class="p-3 border-bottom">
        <h1 class="fs-5 text-purple mb-2">📝 Mes Notes</h1>
        <div class="d-flex gap-2">
          <button id="btn-nouvelle" class="btn btn-purple flex-fill">+ Nouvelle</button>
          <button id="btn-actualiser" class="btn btn-outline-secondary flex-fill">🔄</button>
        </div>
      </div>
      <ul id="liste-notes" class="list-unstyled overflow-auto flex-grow-1 p-2 m-0"></ul>
    </aside>

    <!-- ZONE PRINCIPALE -->
    <main id="contenu" class="contenu flex-grow-1 d-flex flex-column overflow-auto">

      <!-- Bouton retour mobile -->
      <button id="btn-retour" class="btn btn-link text-purple d-none text-start ps-3 pt-4">
        ← Retour
      </button>

      <!-- En-tête de section -->
      <div id="section-header" class="px-4 pt-3 pb-2 border-bottom hidden">
        <h3 id="section-titre" class="text-purple mb-0 fs-5"></h3>
      </div>

      <!-- État vide -->
      <div id="etat-vide" class="d-flex flex-grow-1 align-items-center justify-content-center">
        <p>Sélectionnez une note ou cliquez sur <strong>+ Nouvelle</strong></p>
      </div>
      <!-- Vue détails -->
      <div id="vue-details" class="hidden p-4">
        <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
          <h2 id="detail-titre" class="fs-4 text-purple mb-0"></h2>
          <div class="d-flex align-items-center gap-2">
            <span id="detail-date" class="text-muted small"></span>
            <button id="btn-fermer" class="btn btn-sm btn-outline-secondary">✕</button>
          </div>
        </div>
        <p id="detail-contenu" class="lh-lg"></p>
      </div>

      <!-- Formulaire -->
      <div id="formulaire" class="hidden d-flex flex-column gap-3 p-4 h-100">
        <input type="text" id="input-titre"
          class="form-control form-control-lg bg-transparent border-0 border-bottom rounded-0 text-white px-0"
          placeholder="Titre de la note..." maxlength="100" />
        <textarea id="input-details" class="form-control bg-dark text-white flex-grow-1"
          placeholder="Écrivez vos détails ici..." style="min-height:200px; resize:none;"></textarea>
        <div class="d-flex gap-2">
          <button id="btn-sauvegarder" class="btn btn-success">💾 Sauvegarder</button>
          <button id="btn-annuler" class="btn btn-secondary">Annuler</button>
        </div>
        <p id="msg-statut" class="statut hidden"></p>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="main.js"></script>
</body>

</html>
