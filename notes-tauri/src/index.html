<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Notes that work offline and sync with the Tandem Notes API when the server is reachable.">
  <title>Tandem Notes</title>
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="d-flex vh-100 overflow-hidden">

    <aside id="sidebar" class="sidebar border-end d-flex flex-column">
      <div class="p-3 border-bottom">
        <h1 class="fs-5 text-accent mb-2">Tandem Notes</h1>

        <div id="status-indicator" class="status status-online mb-2" role="status">Online</div>

        <div class="d-flex gap-2">
          <button id="btn-new" type="button" class="btn btn-accent flex-fill">+ New note</button>
          <button id="btn-refresh" type="button" class="btn btn-outline-light flex-fill">Refresh</button>
        </div>
      </div>
      <ul id="note-list" class="list-unstyled overflow-auto flex-grow-1 p-2 m-0"></ul>
    </aside>

    <main id="content" class="content flex-grow-1 d-flex flex-column overflow-auto">

      <button id="btn-back" type="button" class="btn btn-link text-accent d-none text-start ps-3 pt-4">
        &larr; All notes
      </button>

      <div id="section-header" class="px-4 pt-3 pb-2 border-bottom hidden">
        <p id="section-title" class="text-accent mb-0 fw-bold"></p>
      </div>

      <div id="empty-state" class="d-flex flex-grow-1 align-items-center justify-content-center">
        <p>Select a note or click <strong>+ New note</strong></p>
      </div>

      <div id="detail-view" class="hidden p-4">
        <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
          <h2 id="detail-title" class="fs-4 text-accent mb-0">Note</h2>
          <div class="d-flex align-items-center gap-2">
            <span id="detail-date" class="text-dim small"></span>
            <button id="btn-close" type="button" class="btn btn-sm btn-outline-light" aria-label="Close">&times;</button>
          </div>
        </div>
        <p id="detail-body" class="lh-lg"></p>
      </div>

      <form id="note-form" class="hidden d-flex flex-column gap-3 p-4 h-100" novalidate>
        <label for="input-title" class="visually-hidden">Title</label>
        <input type="text" id="input-title"
          class="form-control form-control-lg bg-transparent border-0 border-bottom rounded-0 px-0"
          placeholder="Note title" maxlength="100" required>
        <label for="input-body" class="visually-hidden">Body</label>
        <textarea id="input-body" class="form-control flex-grow-1" placeholder="Write your note here"
          maxlength="10000"></textarea>
        <div class="d-flex gap-2">
          <button id="btn-save" type="submit" class="btn btn-success">Save</button>
          <button id="btn-cancel" type="button" class="btn btn-secondary">Cancel</button>
        </div>
      </form>

    </main>
  </div>

  <p id="status-message" class="status-message hidden" role="status"></p>

  <dialog id="confirm-dialog">
    <p id="confirm-text" class="mb-3"></p>
    <div class="d-flex gap-2 justify-content-end">
      <button id="confirm-cancel" type="button" class="btn btn-secondary">Cancel</button>
      <button id="confirm-delete" type="button" class="btn btn-danger">Delete</button>
    </div>
  </dialog>

  <script type="module" src="main.js"></script>
</body>

</html>
